# Starter CI workflow for GitHub Actions (Python-oriented; adapt as needed).
#
# What this does: every time someone pushes or opens a pull request, GitHub runs
# these checks on a fresh server and shows a green check or red X on the PR.
# This is "Layer 3" of the Code Review Protocol: the safety net that runs
# even if someone skipped the local pre-commit hook.
#
# To use: copy this file into your repository at:
#   .github/workflows/ci.yml
# Then commit and push. GitHub picks it up automatically; no extra setup.
#
# Docs: https://docs.github.com/en/actions/about-github-actions/understanding-github-actions

name: CI

# Run on pushes to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the code onto the runner.
      - uses: actions/checkout@v4

      # 2. Install Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install project and dev dependencies.
      #    Adjust to match how your project declares dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest
          # pip install -e .        # uncomment if your project is a package

      # 4. Run the same hooks as the local pre-commit (lint, format, secret scan, SAST).
      #    This is why CI backs up the hook: it cannot be skipped.
      - name: Run pre-commit checks
        run: pre-commit run --all-files

      # 5. Run the test suite.
      - name: Run tests
        run: pytest
