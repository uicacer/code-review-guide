# ACER starter pre-commit config (Python-oriented; adapt for other languages).
#
# What this does: runs these checks automatically every time you `git commit`.
# If any fail, the commit is blocked until you fix the issue — so problems never
# enter history. This is "Layer 1" of the ACER Code Review Protocol and your most
# important safety net when working solo.
#
# One-time setup:
#   pip install pre-commit
#   pre-commit install            # installs the git hook
#   pre-commit run --all-files    # run against the whole repo once
#
# Docs: https://pre-commit.com/

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files      # blocks accidentally committing big/data files
      - id: check-yaml
      - id: check-json
      - id: detect-private-key           # blocks committing private keys

  # Formatter — rewrites code to one consistent style (no more style debates)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # Linter — flags likely mistakes without running the code
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  # Security linter (SAST) for Python — flags common vulnerability patterns
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-ll"]                    # report medium severity and above

  # Secret scanner — blocks passwords/keys/tokens from being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

# Optional additions as a project matures:
#   - mypy (type checking)
#   - a notebook cleaner (nbstripout) if you commit Jupyter notebooks
